<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카탈로그 — 스크린샷 아카이브</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.1/index.min.js"></script>
<style>
  :root{
    --bg-base:#121212;
    --bg-surface:#181818;
    --bg-surface-alt:#1f1f1f;
    --bg-elevated:#272727;
    --accent:#1ed760;
    --accent-border:#1db954;
    --text-primary:#ffffff;
    --text-secondary:#b3b3b3;
    --text-tertiary:#7c7c7c;
    --danger:#f3727f;
    --warning:#ffa42b;
    --info:#539df5;
    --hairline:rgba(255,255,255,0.08);
    --shadow-heavy:rgba(0,0,0,0.5) 0px 8px 24px;
    --shadow-medium:rgba(0,0,0,0.3) 0px 8px 8px;
    --font-ui:'Pretendard Variable','Pretendard','Pretendard KR',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --font-mono:'SF Mono','IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-ui);
    letter-spacing:-1px;
    background:#000;
    color:var(--text-primary);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:28px 12px;
  }
  button,input,textarea,select{font-family:inherit;letter-spacing:inherit;}
  ::selection{background:var(--accent);color:#000;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- iPhone 16 Plus frame (430 x 932 pt) ---------- */
  .device{
    width:430px;
    height:932px;
    background:#0a0a0a;
    border-radius:62px;
    padding:14px;
    box-shadow:0 30px 70px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,255,255,0.06);
    position:relative;
    flex-shrink:0;
  }
  .screen{
    width:100%;
    height:100%;
    background:var(--bg-base);
    border-radius:48px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .island{
    position:absolute;
    top:12px;left:50%;
    transform:translateX(-50%);
    width:120px;height:36px;
    background:#000;
    border-radius:20px;
    z-index:40;
  }
  .status-bar{
    flex-shrink:0;
    height:54px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 26px 8px;
    font-family:var(--font-ui);
    font-weight:700;
    font-size:15px;
    letter-spacing:-0.3px;
  }
  .status-bar .icons{display:flex;align-items:center;gap:5px;}
  .status-bar svg{display:block;}

  /* ---------- App chrome ---------- */
  .app-header{
    flex-shrink:0;
    padding:6px 20px 12px;
  }
  .app-header .eyebrow{
    font-family:var(--font-mono);
    letter-spacing:1.6px;
    text-transform:uppercase;
    font-size:10.5px;
    color:var(--accent);
    font-weight:700;
  }
  .app-header h1{
    margin:4px 0 0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-1px;
  }

  .search-wrap{
    padding:0 20px 12px;
    flex-shrink:0;
  }
  .search-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-surface-alt);
    border-radius:9999px;
    padding:11px 16px;
    box-shadow:rgb(18,18,18) 0px 1px 0px, rgb(70,70,70) 0px 0px 0px 1px inset;
  }
  .search-pill svg{flex-shrink:0;opacity:.7;}
  .search-pill input{
    border:none;background:transparent;color:var(--text-primary);
    font-size:14px;width:100%;letter-spacing:-1px;
  }
  .search-pill input::placeholder{color:var(--text-tertiary);}

  .cat-scroller{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 20px 16px;
    flex-shrink:0;
    scrollbar-width:none;
  }
  .cat-scroller::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    padding:7px 14px;
    border-radius:9999px;
    background:var(--bg-surface-alt);
    color:var(--text-secondary);
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
    border:none;
    transition:transform .1s ease;
  }
  .cat-pill:active{transform:scale(0.95);}
  .cat-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .cat-pill.active{background:var(--accent);color:#000;}
  .cat-pill .count{opacity:.7;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0;}

  .list-scroll{
    flex:1;
    overflow-y:auto;
    padding:0 10px 100px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background .1s ease;
  }
  .row:hover, .row:active{background:rgba(255,255,255,0.06);}
  .row-thumb{
    width:52px;height:52px;
    border-radius:5px;
    object-fit:cover;
    background:var(--bg-elevated);
    flex-shrink:0;
  }
  .row-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;}
  .row-title{
    font-size:14.5px;font-weight:700;color:var(--text-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-sub{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-secondary);
    white-space:nowrap;overflow:hidden;
  }
  .row-sub .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--cat-color,#999);}
  .row-sub .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-date{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-tertiary);
    flex-shrink:0;
    letter-spacing:0;
  }

  .empty-state{
    text-align:center;
    padding:70px 30px;
    color:var(--text-secondary);
  }
  .empty-state .stamp{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--hairline);
    border-radius:9999px;
    padding:4px 12px;
    margin-bottom:12px;
  }
  .empty-state h3{
    font-family:var(--font-ui);
    color:var(--text-primary);
    font-size:16px;
    margin:0 0 4px;
  }
  .empty-state p{margin:0;font-size:13px;line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:absolute;
    right:20px;bottom:34px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:#000;
    border:none;
    font-size:26px;
    font-weight:400;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-heavy);
    cursor:pointer;
    z-index:35;
    transition:transform .1s ease;
  }
  .fab:active{transform:scale(0.92);}

  .home-indicator{
    position:absolute;
    bottom:8px;left:50%;
    transform:translateX(-50%);
    width:134px;height:5px;
    background:rgba(255,255,255,0.7);
    border-radius:100px;
    z-index:40;
  }

  /* ---------- Sheets ---------- */
  .sheet-layer{
    position:absolute;inset:0;
    z-index:60;
    display:flex;align-items:flex-end;
    pointer-events:none;
  }
  .sheet-layer.open{pointer-events:auto;}
  .sheet-scrim{
    position:absolute;inset:0;
    background:rgba(0,0,0,0);
    transition:background .2s ease;
  }
  .sheet-layer.open .sheet-scrim{background:rgba(0,0,0,0.6);}
  .sheet{
    position:relative;
    width:100%;
    max-height:86%;
    background:var(--bg-surface);
    border-radius:20px 20px 0 0;
    box-shadow:var(--shadow-heavy);
    padding:10px 20px 24px;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-layer.open .sheet{transform:translateY(0);}
  .sheet-handle{
    width:36px;height:4px;
    background:var(--hairline);
    border-radius:100px;
    margin:2px auto 14px;
  }
  .sheet-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  }
  .sheet-head h2{
    font-size:17px;font-weight:700;margin:0;letter-spacing:-1px;
  }
  .sheet-close{
    background:var(--bg-surface-alt);
    border:none;color:var(--text-secondary);
    width:28px;height:28px;border-radius:50%;
    font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .preview-thumb{
    width:100%;max-height:180px;object-fit:contain;
    background:#000;border-radius:10px;margin-bottom:14px;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--text-tertiary);
    margin-bottom:6px;
  }
  .field input[type=text], .field textarea{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    letter-spacing:-1px;
    color:var(--text-primary);
    background:var(--bg-surface-alt);
    box-shadow:rgb(18,18,18) 0px 1px 0px, rgb(70,70,70) 0px 0px 0px 1px inset;
    resize:vertical;
  }
  .field textarea{min-height:96px;line-height:1.5;}
  .field textarea[readonly]{color:var(--text-secondary);}

  .cat-select{display:flex;flex-wrap:wrap;gap:7px;}
  .cat-chip{
    display:flex;align-items:center;gap:6px;
    border:none;
    border-radius:9999px;
    padding:7px 12px;
    font-size:12.5px;font-weight:600;
    cursor:pointer;
    background:var(--bg-surface-alt);
    color:var(--text-secondary);
  }
  .cat-chip.selected{background:var(--cat-color);color:#000;font-weight:700;}
  .cat-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85;}

  .sheet-actions{display:flex;gap:8px;margin-top:6px;}
  .btn{
    flex:1;
    border:none;
    border-radius:9999px;
    padding:12px 16px;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:-0.5px;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-secondary{background:var(--bg-surface-alt);color:var(--text-primary);}
  .btn-outline{background:transparent;border:1px solid var(--text-tertiary);color:var(--text-primary);}
  .btn-danger{background:transparent;border:1px solid rgba(243,114,127,0.4);color:var(--danger);}

  /* ---------- Processing overlay ---------- */
  .processing-layer{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.7);
  }
  .processing-box{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:0;color:var(--text-secondary);
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.15);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:absolute;
    bottom:100px;left:50%;
    transform:translateX(-50%);
    background:var(--bg-elevated);
    color:var(--text-primary);
    padding:10px 18px;
    border-radius:9999px;
    font-size:12.5px;
    letter-spacing:-0.5px;
    box-shadow:var(--shadow-heavy);
    z-index:80;
    white-space:nowrap;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="device">
  <div class="screen" id="screen">
    <div class="island"></div>

    <div class="status-bar">
      <span>9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 9L1 11M4.5 6L4.5 11M8 3L8 11M11.5 1L11.5 11" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 5.5C4.5 2 11.5 2 15 5.5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="white" stroke-width="1.2"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.2" fill="white"/><rect x="22" y="4" width="2" height="4" rx="1" fill="white"/></svg>
      </span>
    </div>

    <div class="app-header">
      <div class="eyebrow">No. 001 — Archive</div>
      <h1>카탈로그</h1>
    </div>

    <div class="search-wrap">
      <div class="search-pill">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="5" stroke="#7c7c7c" stroke-width="1.6"/><path d="M9.8 9.8L13 13" stroke="#7c7c7c" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="저장된 내용 검색">
      </div>
    </div>

    <div class="cat-scroller" id="catScroller"></div>

    <div class="list-scroll" id="listScroll">
      <div id="grid"></div>
    </div>

    <button class="fab" id="fabBtn" aria-label="스크린샷 추가">＋</button>
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <div class="home-indicator"></div>

    <!-- Processing overlay -->
    <div class="processing-layer hidden" id="processingOverlay">
      <div class="processing-box">
        <div class="spinner"></div>
        <div id="processingText">이미지 분석 중...</div>
      </div>
    </div>

    <!-- Confirm sheet -->
    <div class="sheet-layer" id="confirmLayer">
      <div class="sheet-scrim" data-close="confirm"></div>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>추출 결과 확인</h2>
          <button class="sheet-close" id="confirmClose">✕</button>
        </div>
        <img class="preview-thumb" id="confirmThumb" alt="업로드한 스크린샷">
        <div class="field">
          <label>제목</label>
          <input type="text" id="confirmTitle">
        </div>
        <div class="field">
          <label>카테고리</label>
          <div class="cat-select" id="confirmCatSelect"></div>
        </div>
        <div class="field">
          <label>추출된 텍스트</label>
          <textarea id="confirmText"></textarea>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-outline" id="confirmCancel">취소</button>
          <button class="btn btn-primary" id="confirmSave">저장</button>
        </div>
      </div>
    </div>

    <!-- Detail sheet -->
    <div class="sheet-layer" id="detailLayer">
      <div class="sheet-scrim" data-close="detail"></div>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2 id="detailTitle"></h2>
          <button class="sheet-close" id="detailClose">✕</button>
        </div>
        <img class="preview-thumb" id="detailThumb" alt="저장된 스크린샷">
        <div class="field">
          <label>카테고리</label>
          <div class="cat-select" id="detailCatSelect"></div>
        </div>
        <div class="field">
          <label>추출된 텍스트</label>
          <textarea id="detailText" readonly></textarea>
        </div>
        <div class="field">
          <label>메모</label>
          <textarea id="detailMemo" placeholder="메모를 남겨보세요 (자동 저장)"></textarea>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-danger" id="detailDelete">삭제</button>
          <button class="btn btn-primary" id="detailDone">닫기</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>
  </div>
</div>

<script>
const CATEGORIES = [
  { id:'todo',     label:'할일/메모',   color:'#6C8FC7' },
  { id:'receipt',  label:'영수증/구매', color:'#FFA42B' },
  { id:'link',     label:'링크/SNS',   color:'#539DF5' },
  { id:'contact',  label:'연락처',     color:'#C77DAE' },
  { id:'schedule', label:'일정',       color:'#D98671' },
  { id:'etc',      label:'기타',       color:'#8A8A8A' },
];
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1];

let items = [];
let activeCategory = 'all';
let searchQuery = '';
let pendingUpload = null;
let activeDetailId = null;

const $ = sel => document.querySelector(sel);
const grid = $('#grid');
const catScroller = $('#catScroller');
const screenEl = $('#screen');

/* ---------------- Storage (브라우저 localStorage — 이 기기/브라우저에만 저장돼요) ---------------- */
const STORAGE_KEY = 'catalog_items_v1';
async function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function persistItems(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }catch(e){
    console.error(e);
    showToast('저장 중 오류가 발생했어요. (브라우저 저장 공간이 가득 찼을 수 있어요)');
  }
}

/* ---------------- Utilities ---------------- */
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.add('hidden'), 2400);
}

function isHeicFile(file){
  return /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');
}

async function ensureDecodable(file){
  if(!isHeicFile(file)) return file;
  if(typeof heic2any !== 'function'){
    throw new Error('HEIC 변환 기능을 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
  }
  try{
    const converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
    return Array.isArray(converted) ? converted[0] : converted;
  }catch(e){
    console.error(e);
    throw new Error('이 HEIC 파일은 변환하지 못했어요. PNG/JPG로 저장한 파일을 사용해주세요.');
  }
}

function loadImageFromUrl(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('decode-failed'));
    img.src = url;
  });
}

function readAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('read-failed'));
    reader.readAsDataURL(file);
  });
}

async function loadImageElement(blobOrFile){
  // 1차: object URL 방식
  const objectUrl = URL.createObjectURL(blobOrFile);
  try{
    const img = await loadImageFromUrl(objectUrl);
    URL.revokeObjectURL(objectUrl);
    return img;
  }catch(e){
    URL.revokeObjectURL(objectUrl);
  }
  // 2차: data URL 방식 (환경에 따라 blob: 이 막혀있을 수 있어 재시도)
  try{
    const dataUrl = await readAsDataUrl(blobOrFile);
    return await loadImageFromUrl(dataUrl);
  }catch(e){
    const info = `(${blobOrFile.name || '이름없음'} · ${blobOrFile.type || '타입 알 수 없음'} · ${Math.round((blobOrFile.size||0)/1024)}KB)`;
    throw new Error(`이미지를 불러올 수 없어요. 파일이 손상되었거나 지원하지 않는 형식일 수 있어요. ${info}`);
  }
}

function resizeImage(blobOrFile, maxWidth=800, quality=0.75){
  return new Promise((resolve,reject)=>{
    loadImageElement(blobOrFile).then(img=>{
      try{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale) || 1;
        const h = Math.round(img.height * scale) || 1;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      }catch(e){
        reject(new Error('이미지를 처리하는 중 오류가 발생했어요: ' + e.message));
      }
    }).catch(reject);
  });
}

function formatDate(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
}

/* ---------------- Claude API ---------------- */
const EXTRACTION_PROMPT = `당신은 스크린샷 이미지를 분석해서 정보를 추출하고 분류하는 도우미입니다.
이 이미지를 분석해서 아래 JSON 형식으로만 응답하세요. 다른 설명이나 코드블록 표시 없이 순수 JSON만 출력하세요.

{"title": "15자 이내 핵심 요약 제목", "text": "이미지에서 읽을 수 있는 모든 텍스트를 최대한 정확하게 옮겨적은 내용", "category": "todo|receipt|link|contact|schedule|etc 중 하나"}

카테고리 기준:
- todo: 할일, 체크리스트, 메모
- receipt: 영수증, 구매/주문 내역, 결제 정보
- link: 링크, SNS 게시물, 채팅/대화 캡처
- contact: 연락처, 명함, 전화번호/이메일
- schedule: 일정, 예약, 날짜와 시간이 중심인 정보
- etc: 위에 해당하지 않는 경우

이미지에 텍스트가 거의 없다면 text는 보이는 내용을 간단히 설명하세요.`;

async function analyzeImage(base64){
  const response = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64 })
  });
  if(!response.ok){
    const errBody = await response.json().catch(()=>({}));
    throw new Error(errBody.error || ('API 요청 실패: ' + response.status));
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('분석 결과를 받지 못했어요.');
  let raw = textBlock.text.trim();
  raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ throw new Error('분석 결과 형식을 읽을 수 없어요.'); }
  if(!CATEGORIES.some(c=>c.id===parsed.category)) parsed.category = 'etc';
  return parsed;
}

/* ---------------- Upload flow ---------------- */
async function handleFile(file){
  console.log('선택된 파일:', file && file.name, file && file.type, file && file.size);
  const looksLikeImage = file && (file.type.startsWith('image/') || isHeicFile(file) || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(file.name || ''));
  if(!looksLikeImage){
    showToast('이미지 파일만 업로드할 수 있어요.');
    return;
  }
  $('#processingOverlay').classList.remove('hidden');
  $('#processingText').textContent = isHeicFile(file) ? 'HEIC 변환 중...' : '이미지 분석 중...';
  try{
    const decodableFile = await ensureDecodable(file);
    $('#processingText').textContent = '이미지 분석 중...';
    const imageDataUrl = await resizeImage(decodableFile);
    const result = await analyzeImage(imageDataUrl.split(',')[1]);
    pendingUpload = {
      imageDataUrl,
      title: result.title || '제목 없음',
      text: result.text || '',
      category: result.category || 'etc',
    };
    openConfirmSheet();
  }catch(err){
    console.error(err);
    showToast(err.message || '분석 중 오류가 발생했어요.');
  }finally{
    $('#processingOverlay').classList.add('hidden');
  }
}

function buildCatChips(container, selectedId, onSelect){
  container.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'cat-chip' + (cat.id===selectedId ? ' selected' : '');
    chip.style.setProperty('--cat-color', cat.color);
    chip.innerHTML = `<span class="dot"></span>${cat.label}`;
    chip.addEventListener('click', ()=>{
      container.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      onSelect(cat.id);
    });
    container.appendChild(chip);
  });
}

function openConfirmSheet(){
  if(!pendingUpload) return;
  $('#confirmThumb').src = pendingUpload.imageDataUrl;
  $('#confirmTitle').value = pendingUpload.title;
  $('#confirmText').value = pendingUpload.text;
  buildCatChips($('#confirmCatSelect'), pendingUpload.category, (id)=>{ pendingUpload.category = id; });
  $('#confirmLayer').classList.add('open');
}
function closeConfirmSheet(){
  $('#confirmLayer').classList.remove('open');
  pendingUpload = null;
  $('#fileInput').value = '';
}
$('#confirmClose').addEventListener('click', closeConfirmSheet);
$('#confirmCancel').addEventListener('click', closeConfirmSheet);
$('#confirmLayer').querySelector('.sheet-scrim').addEventListener('click', closeConfirmSheet);

$('#confirmSave').addEventListener('click', async ()=>{
  if(!pendingUpload) return;
  const item = {
    id: 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    imageDataUrl: pendingUpload.imageDataUrl,
    title: $('#confirmTitle').value.trim() || '제목 없음',
    text: $('#confirmText').value.trim(),
    category: pendingUpload.category,
    memo: '',
    createdAt: new Date().toISOString(),
  };
  items.unshift(item);
  await persistItems();
  closeConfirmSheet();
  render();
  showToast('카드로 저장했어요.');
});

/* ---------------- Detail sheet ---------------- */
function openDetail(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  activeDetailId = id;
  $('#detailTitle').textContent = item.title;
  $('#detailThumb').src = item.imageDataUrl;
  $('#detailText').value = item.text;
  $('#detailMemo').value = item.memo || '';
  buildCatChips($('#detailCatSelect'), item.category, async (id2)=>{
    item.category = id2;
    await persistItems();
    render();
  });
  $('#detailLayer').classList.add('open');
}
function closeDetail(){
  $('#detailLayer').classList.remove('open');
  activeDetailId = null;
}
$('#detailClose').addEventListener('click', closeDetail);
$('#detailDone').addEventListener('click', closeDetail);
$('#detailLayer').querySelector('.sheet-scrim').addEventListener('click', closeDetail);
$('#detailMemo').addEventListener('change', async ()=>{
  const item = items.find(i=>i.id===activeDetailId);
  if(!item) return;
  item.memo = $('#detailMemo').value;
  await persistItems();
});
$('#detailDelete').addEventListener('click', async ()=>{
  if(!activeDetailId) return;
  if(!confirm('이 카드를 삭제할까요?')) return;
  items = items.filter(i=>i.id!==activeDetailId);
  await persistItems();
  closeDetail();
  render();
  showToast('삭제했어요.');
});

/* ---------------- Rendering ---------------- */
function renderCatScroller(){
  const counts = {};
  CATEGORIES.forEach(c=>counts[c.id]=0);
  items.forEach(i=>{ if(counts[i.category]!==undefined) counts[i.category]++; });

  const allPill = `
    <button class="cat-pill ${activeCategory==='all'?'active':''}" data-cat="all">
      전체 <span class="count">${items.length}</span>
    </button>`;
  const catPills = CATEGORIES.map(c=>`
    <button class="cat-pill ${activeCategory===c.id?'active':''}" data-cat="${c.id}" style="${activeCategory===c.id?`background:${c.color};color:#000;`:''}">
      <span class="dot" style="background:${activeCategory===c.id?'#000':c.color}"></span>${c.label}
      <span class="count">${counts[c.id]}</span>
    </button>`).join('');
  catScroller.innerHTML = allPill + catPills;

  catScroller.querySelectorAll('.cat-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      render();
    });
  });
}

function getFilteredItems(){
  return items.filter(item=>{
    const matchCat = activeCategory==='all' || item.category===activeCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchQuery = !q || item.title.toLowerCase().includes(q) || item.text.toLowerCase().includes(q);
    return matchCat && matchQuery;
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderGrid(){
  const filtered = getFilteredItems();

  if(filtered.length===0){
    grid.innerHTML = `
      <div class="empty-state">
        <div class="stamp">Empty</div>
        <h3>${items.length===0 ? '아직 카드가 없어요' : '검색 결과가 없어요'}</h3>
        <p>${items.length===0 ? '오른쪽 아래 ＋ 버튼으로<br>첫 스크린샷을 올려보세요.' : '다른 검색어나 카테고리를<br>시도해보세요.'}</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(item=>{
    const cat = catById(item.category);
    return `
      <div class="row" data-id="${item.id}" style="--cat-color:${cat.color}">
        <img class="row-thumb" src="${item.imageDataUrl}" alt="">
        <div class="row-body">
          <div class="row-title">${escapeHtml(item.title)}</div>
          <div class="row-sub">
            <span class="dot"></span>
            <span class="txt">${escapeHtml(cat.label)} · ${escapeHtml(item.text || '텍스트 없음')}</span>
          </div>
        </div>
        <span class="row-date">${formatDate(item.createdAt)}</span>
      </div>`;
  }).join('');

  grid.querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click', ()=> openDetail(row.dataset.id));
  });
}

function render(){
  renderCatScroller();
  renderGrid();
}

/* ---------------- Upload interactions ---------------- */
const fileInput = $('#fileInput');
$('#fabBtn').addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) handleFile(file);
});
document.addEventListener('paste', (e)=>{
  const clip = e.clipboardData && e.clipboardData.items;
  if(!clip) return;
  for(const it of clip){
    if(it.type.startsWith('image/')){
      const file = it.getAsFile();
      if(file) handleFile(file);
      break;
    }
  }
});

$('#searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  renderGrid();
});

/* ---------------- Init ---------------- */
(async function init(){
  grid.innerHTML = `<div class="empty-state"><div class="stamp">Loading</div><h3>불러오는 중...</h3></div>`;
  items = await loadItems();
  render();
})();
</script>
